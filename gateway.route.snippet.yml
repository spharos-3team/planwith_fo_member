# Gateway route snippet for planwith-fo-member
# Does NOT patch the Gateway repo automatically. Copy-paste into:
#   planwith_gateway/src/main/resources/application.yaml
#
# Under: spring.cloud.gateway.server.webflux.routes
# And add the springdoc.swagger-ui.urls entry at the bottom.
#
# Eureka lookup: lb://planwith-fo-member (matches spring.application.name).

            - id: planwith-fo-member
              uri: lb://planwith-fo-member
              predicates:
                - Path=/api/planwith-fo-member/**
            - id: planwith-fo-member-v1
              uri: lb://planwith-fo-member
              predicates:
                - Path=/api/v1/members/**,/api/v1/auth/**,/api/v1/terms/**,/api/v1/terms
            - id: planwith-fo-member-docs
              uri: lb://planwith-fo-member
              predicates:
                - Path=/docs/planwith-fo-member,/docs/planwith-fo-member/**
              filters:
                - RewritePath=/docs/planwith-fo-member(?<segment>/?.*), /v3/api-docs${segment}

