spring:
  datasource:
    url: jdbc:h2:mem:member_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    enabled: false

app:
  jwt:
    issuer: http://localhost:8082
    audience: planwith-api
    key-id: test-key
    private-key-path:
    public-key-path:
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  refresh-cookie:
    name: refresh_token
    secure: false
    same-site: Lax
    domain:
    path: /api/v1/auth
  gateway:
    internal-token: test-gateway-token
    trust-check-enabled: false
    public-url: /
  email-verification:
    code-ttl-seconds: 600
    verified-ttl-seconds: 1800
    code-length: 6
  email:
    stub-enabled: true
    from:
  portone:
    store-id: store-test
    channel-key: channel-key-test
    api-secret: test-secret
    api-base-url: https://api.portone.io
    verified-ttl-seconds: 1800
    stub-enabled: true
  social:
    stub-enabled: true
    google:
      client-id: test
      client-secret: test
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    kakao:
      client-id: test
      client-secret: test
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: test
      client-secret: test
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
