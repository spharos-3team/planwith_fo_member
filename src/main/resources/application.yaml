spring:
  application:
    name: planwith-fo-member
  datasource:
    # Local default: infra MySQL on host port 3307. Docker overrides via env/member.env.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:member_user}
    password: ${DB_PASSWORD:member_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8082}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:True}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-member-deploy-v1}
  email-verification:
    code-ttl-seconds: ${EMAIL_VERIFICATION_CODE_TTL_SECONDS:600}
    verified-ttl-seconds: ${EMAIL_VERIFICATION_VERIFIED_TTL_SECONDS:1800}
    code-length: ${EMAIL_VERIFICATION_CODE_LENGTH:6}
  portone:
    # 로컬 스텁 기본값. 실연동 시 PORTONE_* 환경변수로 덮어쓴다.
    store-id: ${PORTONE_STORE_ID:store-local-stub}
    channel-key: ${PORTONE_CHANNEL_KEY:channel-key-local-stub}
    api-secret: ${PORTONE_API_SECRET:}
    api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    verified-ttl-seconds: ${PORTONE_VERIFIED_TTL_SECONDS:1800}
    # true: 포트원 실호출 없이 스텁 (로컬/테스트). 운영은 false + 시크릿 설정.
    stub-enabled: ${PORTONE_STUB_ENABLED:true}
