spring:
  application:
    name: planwith-fo-member
  datasource:
    # Local default: infra MySQL on host port 3307. Local run uses module `.env`.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:member_user}
    password: ${DB_PASSWORD:member_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:planwith-fo-member}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${MEMBER_KAFKA_CONSUMER_ENABLED:${MEMBER_KAFKA_ENABLED:true}}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8082}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Docker/서버는 Gateway Swagger(:8000)를 쓴다. 로컬 bootRun 기본은 활성.
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

eureka:
  client:
    # Docker/AWS는 compose에서 EUREKA_CLIENT_ENABLED=true. 로컬 단독은 .env에서 false
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      # Quoted: unquoted http://... is invalid YAML (':' map). Docker DNS default.
      # Local Eureka: EUREKA_DEFAULT_ZONE=http://localhost:8761/eureka/
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8082}
    audience: ${JWT_AUDIENCE:planwith-api}
    key-id: ${JWT_KEY_ID:planwith-member-local}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  refresh-cookie:
    name: ${REFRESH_COOKIE_NAME:refresh_token}
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    domain: ${REFRESH_COOKIE_DOMAIN:}
    path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
  gateway:
    # 로컬 단독(local-direct) 기본 off. Gateway 경유 운영은 true + GATEWAY_INTERNAL_TOKEN
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
    trust-check-enabled: ${GATEWAY_TRUST_CHECK_ENABLED:false}
    # Relative "/" avoids embedding Docker hostname / LAN IP in OpenAPI servers.
    # Swagger Try-it-out then uses the browser origin (Gateway :8000).
    public-url: ${GATEWAY_PUBLIC_URL:/}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-member-deploy-v1}
  kafka:
    # false: Kafka 미기동 환경(테스트/로컬 단독). 운영은 true.
    enabled: ${MEMBER_KAFKA_ENABLED:true}
    consumer-enabled: ${MEMBER_KAFKA_CONSUMER_ENABLED:${MEMBER_KAFKA_ENABLED:true}}
    member-created-topic: ${MEMBER_TOPIC_MEMBER_CREATED:planwith.member.created}
    follow-created-topic: ${MEMBER_TOPIC_FOLLOW_CREATED:planwith.follow.created}
    follow-removed-topic: ${MEMBER_TOPIC_FOLLOW_REMOVED:planwith.follow.removed}
    grade-changed-topic: ${MEMBER_TOPIC_GRADE_CHANGED:planwith.grade.changed}
  email-verification:
    code-ttl-seconds: ${EMAIL_VERIFICATION_CODE_TTL_SECONDS:600}
    verified-ttl-seconds: ${EMAIL_VERIFICATION_VERIFIED_TTL_SECONDS:1800}
    code-length: ${EMAIL_VERIFICATION_CODE_LENGTH:6}
  email:
    # true: 서버 로그에 코드 출력 (테스트/로컬 기본). false: SMTP 실발송.
    stub-enabled: ${EMAIL_STUB_ENABLED:true}
    from: ${MAIL_FROM:}
  portone:
    # 로컬 스텁 기본값. 실연동 시 PORTONE_* 환경변수로 덮어쓴다.
    store-id: ${PORTONE_STORE_ID:store-local-stub}
    channel-key: ${PORTONE_CHANNEL_KEY:channel-key-local-stub}
    api-secret: ${PORTONE_API_SECRET:}
    api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    verified-ttl-seconds: ${PORTONE_VERIFIED_TTL_SECONDS:1800}
    # true: 포트원 실호출 없이 스텁 (로컬/테스트). 운영은 false + 시크릿 설정.
    stub-enabled: ${PORTONE_STUB_ENABLED:true}
  social:
    # true: OAuth 실호출 없이 스텁. authorizationCode = stub:{socialId}:{email}
    stub-enabled: ${SOCIAL_STUB_ENABLED:true}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
      user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}
