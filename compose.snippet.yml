  # Member FO — env: common.env + member.env
  planwith-fo-member:
    image: planwith/planwith-fo-member:latest
    pull_policy: never
    container_name: planwith-planwith-fo-member
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
    env_file:
      - ./env/common.env
      - ./env/member.env
    environment:
      SERVER_PORT: 8082
      SERVER_ADDRESS: 0.0.0.0
      SPRING_APPLICATION_NAME: planwith-fo-member
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery:8761/eureka/}
    networks:
      - planwith-net
